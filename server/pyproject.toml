[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cr-arena-server"
version = "0.1.0"
description = "Competition ladder server for the cr_sim Clash-Royale-style battle simulator."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "cr-sim>=0.1.0",       # the gym package (../gym)
    "websockets>=12.0",
]

[project.scripts]
cr-arena = "cr_server.server:run"

[tool.setuptools]
packages = ["cr_server"]
