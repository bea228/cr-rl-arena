<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Replay · Arena Ladder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23ffb829'/%3E%3Cpath d='M5 9l3.5 3L12 7l3.5 5L19 9l-1.2 7.4H6.2z' fill='%231a1200'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090b10; --bg-2: #0e1118; --panel: #12161f; --panel-2: #171c27;
    --line: #222938; --line-2: #2c3446; --row: #1a1f2b;
    --fg: #eef1f7; --fg-2: #b9c0d0; --muted: #7d879c; --faint: #566076;
    --gold: #ffb829; --win: #3ddc97; --loss: #ff6166; --draw: #8f9ab3;
    --p0: #5aa8ff; --p1: #ff6f91; --elixir: #c77dff;
    --disp: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--fg); font: 14px/1.45 var(--body); font-feature-settings: "tnum"; -webkit-font-smoothing: antialiased; min-height: 100vh;
    background: radial-gradient(1100px 520px at 80% -180px, rgba(255,184,41,.08), transparent 62%), radial-gradient(900px 480px at 0% -120px, rgba(90,168,255,.08), transparent 60%), var(--bg); }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 18px 28px 40px; }
  .back { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-weight: 600; font-size: 13px; padding: 6px 10px 6px 6px; margin: 0 0 12px -6px; border-radius: 8px; }
  .back:hover { color: var(--fg); background: rgba(255,255,255,.04); }

  .stage { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: start; }
  .board { position: relative; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: #0b0e14; line-height: 0; }
  canvas { display: block; cursor: crosshair; }
  .tip { position: absolute; pointer-events: none; z-index: 3; transform: translate(-50%, -130%); background: #05070b; border: 1px solid var(--line-2); border-radius: 8px;
    padding: 5px 9px; font-size: 12px; line-height: 1.3; white-space: nowrap; text-transform: capitalize; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  .tip b { font-weight: 600; } .tip span { color: var(--muted); margin-left: 6px; }
  .over { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(9,11,16,.72); backdrop-filter: blur(3px); line-height: 1.4; text-align: center; padding: 24px; }
  .over[hidden] { display: none; }
  .over b { display: block; font: 700 40px/1 var(--disp); letter-spacing: .04em; text-transform: uppercase; }
  .over span { display: block; color: var(--fg-2); margin: 8px 0 16px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 9px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: var(--gold); color: var(--gold); }

  .side { display: grid; gap: 14px; min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
  .score { padding: 6px 0; }
  .pl { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 18px; }
  .pl + .pl { border-top: 1px solid var(--row); }
  .pl > i { width: 4px; align-self: stretch; border-radius: 3px; }
  .pl .seat { font: 600 10.5px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .pl .n { font: 600 25px/1.1 var(--disp); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; color: var(--fg-2); }
  .pl.won .n { color: var(--fg); }
  .pl .cr { font: 700 46px/.9 var(--disp); color: var(--muted); min-width: 28px; text-align: right; }
  .pl.lead .cr { color: var(--gold); }
  .elx { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .elx .bar { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; height: 7px; max-width: 240px; }
  .elx .bar span { border-radius: 2px; background: #232a39; overflow: hidden; }
  .elx .bar span i { display: block; height: 100%; width: var(--f, 0%); background: var(--elixir); }
  .elx b { font: 600 15px/1 var(--disp); color: var(--elixir); min-width: 26px; }
  .result { padding: 12px 18px; border-top: 1px solid var(--line); color: var(--fg-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .result b { color: var(--fg); font-weight: 600; }
  .badge { font: 700 9.5px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 3px 6px; border-radius: 5px; white-space: nowrap; }
  .badge.up { background: rgba(255,184,41,.16); color: var(--gold); } .badge.ff { background: rgba(255,97,102,.13); color: var(--loss); } .badge.dr { background: rgba(143,154,179,.16); color: var(--draw); }
  .warn { margin: 0; padding: 12px 18px; border-top: 1px solid var(--line); background: rgba(255,184,41,.07); color: #ffd98a; font-size: 12.5px; }

  .ctl { padding: 14px 18px 16px; }
  .ctl .top { display: flex; align-items: center; gap: 12px; }
  .play { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--gold); color: #1a1200; display: grid; place-items: center; cursor: pointer; }
  .play:hover { filter: brightness(1.08); }
  .clock { font: 600 30px/1 var(--disp); letter-spacing: .02em; }
  .clock small { font: 500 13px/1 var(--body); color: var(--muted); margin-left: 6px; }
  .ot { font: 700 10px/1 var(--body); letter-spacing: .1em; padding: 3px 6px; border-radius: 5px; background: rgba(255,97,102,.14); color: var(--loss); }
  .ot[hidden] { display: none; }
  .speed { margin-left: auto; display: flex; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; }
  .speed button { border: 0; background: transparent; padding: 7px 10px; font-weight: 600; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .speed button[aria-pressed="true"] { background: var(--panel-2); color: var(--gold); }
  .track { position: relative; margin-top: 14px; height: 26px; }
  .track .marks { position: absolute; left: 7px; right: 7px; top: 0; height: 7px; pointer-events: none; }
  .track .marks i { position: absolute; top: 0; width: 2px; height: 7px; border-radius: 1px; opacity: .85; }
  .track .marks i.reg { top: 9px; height: 12px; width: 1px; background: var(--faint); opacity: 1; }
  input[type=range] { -webkit-appearance: none; appearance: none; position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 16px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 99px; background: linear-gradient(90deg, var(--gold) var(--p, 0%), #2a3142 var(--p, 0%)); }
  input[type=range]::-moz-range-track { height: 5px; border-radius: 99px; background: #2a3142; }
  input[type=range]::-moz-range-progress { height: 5px; border-radius: 99px; background: var(--gold); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; margin-top: -4.5px; box-shadow: 0 0 0 3px rgba(255,184,41,.25); }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; }
  .keys { margin: 10px 0 0; color: var(--faint); font-size: 11.5px; }
  kbd { font: 600 10.5px/1 var(--body); border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 5px; color: var(--muted); }

  .ph { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--line); }
  .ph h2 { margin: 0; font: 600 17px/1 var(--disp); letter-spacing: .09em; text-transform: uppercase; }
  .ph span { color: var(--muted); font-size: 12.5px; }
  .log { list-style: none; margin: 0; padding: 4px 0; max-height: 262px; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  .log button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 44px 3px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 18px; font-size: 13px; }
  .log button:hover { background: rgba(255,255,255,.035); }
  .log button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  .log .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .log i { width: 3px; height: 14px; border-radius: 2px; }
  .log .c { text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg-2); }
  .log .w { color: var(--faint); font-size: 11.5px; }
  .log li.past .c { color: var(--muted); } .log li.now button { background: rgba(255,184,41,.08); } .log li.now .c { color: var(--fg); font-weight: 600; }
  .log .none { padding: 18px; color: var(--muted); }
  .decks { padding: 14px 18px 16px; display: grid; gap: 12px; }
  .decks h3 { margin: 0 0 7px; font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .decks h3 i { width: 8px; height: 8px; border-radius: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { padding: 4px 8px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line-2); font-size: 11.5px; color: var(--fg-2); text-transform: capitalize; }

  .msg { max-width: 460px; margin: 16vh auto 0; text-align: center; color: var(--fg-2); }
  .msg b { display: block; font: 700 36px/1 var(--disp); letter-spacing: .04em; text-transform: uppercase; color: var(--fg); margin-bottom: 10px; }
  .msg .btn { margin-top: 18px; }
  .spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line-2); border-top-color: var(--gold); margin: 0 auto 16px; animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  @media (max-width: 860px) {
    .wrap { padding: 12px 14px 32px; }
    .stage { grid-template-columns: 1fr; }
    .board { justify-self: center; }
    .log { max-height: 220px; }
    .keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2s; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Ladder</a>

  <div class="msg" id="msg"><div class="spin"></div><span>Rebuilding the match…</span></div>

  <div class="stage" id="stage" hidden>
    <div class="board" id="board">
      <canvas id="cv" aria-label="Arena"></canvas>
      <div class="tip" id="tip" hidden></div>
      <div class="over" id="over" hidden><div><b id="over-t"></b><span id="over-s"></span><button class="btn" id="again" type="button">Watch again</button></div></div>
    </div>

    <div class="side">
      <section class="panel" aria-label="Score">
        <div class="score">
          <div class="pl" id="pl1"><i style="background:var(--p1)"></i>
            <div style="min-width:0"><div class="seat">Top seat</div><div class="n" id="n1"></div>
              <div class="elx"><div class="bar" id="e1"></div><b id="ev1"></b></div></div>
            <div class="cr" id="c1">0</div></div>
          <div class="pl" id="pl0"><i style="background:var(--p0)"></i>
            <div style="min-width:0"><div class="seat">Bottom seat</div><div class="n" id="n0"></div>
              <div class="elx"><div class="bar" id="e0"></div><b id="ev0"></b></div></div>
            <div class="cr" id="c0">0</div></div>
        </div>
        <div class="result" id="result"></div>
        <p class="warn" id="warn" hidden></p>
      </section>

      <section class="panel ctl" aria-label="Playback">
        <div class="top">
          <button class="play" id="play" type="button" aria-label="Play"></button>
          <div class="clock"><span id="now">0:00</span><small id="total"></small></div>
          <span class="ot" id="ot" hidden>Overtime</span>
          <div class="speed" id="speed" role="group" aria-label="Playback speed"></div>
        </div>
        <div class="track"><div class="marks" id="marks"></div>
          <input type="range" id="scrub" min="0" max="1" step="1" value="0" aria-label="Match time"></div>
        <p class="keys"><kbd>Space</kbd> play / pause · <kbd>←</kbd> <kbd>→</kbd> skip 5 seconds</p>
      </section>

      <section class="panel" aria-labelledby="h-log">
        <div class="ph"><h2 id="h-log">Deploys</h2><span id="log-n"></span></div>
        <ol class="log" id="log"></ol>
      </section>

      <section class="panel decks" id="decks" aria-label="Decks" hidden></section>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clock = (ticks, tps) => { const s = Math.floor(ticks / tps); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const cardName = (c) => String(c).replace(/_/g, " ");
const abbr = (c) => { const w = String(c).split("_").filter(Boolean); return (w.length > 1 ? w[0][0] + w[1][0] : c.slice(0, 2)).toUpperCase(); };
const P = ["#5aa8ff", "#ff6f91"], PD = ["#16304f", "#4f1a2b"];
const ICON = { play: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>',
               pause: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>' };

let T = null, meta = null, frames = null, events = null;
let tick = 0, playing = false, speed = 1, last = 0, tile = 20, dpr = 1, W = 0, H = 0, hover = null, evIdx = -1;
const cv = $("cv"), ctx = cv.getContext("2d");

function fail(title, text) {
  $("msg").innerHTML = `<b>${esc(title)}</b><span>${esc(text)}</span><br><a class="btn" href="/">Back to the ladder</a>`;
}

async function load() {
  const id = new URLSearchParams(location.search).get("id");
  if (!id || !/^\d+$/.test(id)) return fail("No match selected", "Pick a match from the results list on the ladder.");
  let res;
  try { res = await fetch("/api/replay/" + id); } catch (e) { return fail("Can't reach the server", "Check your connection and try again."); }
  if (res.status === 404) return fail("Replay not found", "This match has no saved replay.");
  if (!res.ok) return fail("Replay failed to load", "The server could not rebuild this match.");
  T = await res.json(); meta = T.meta; frames = T.frames; events = T.events;
  setup();
}

function setup() {
  const m = T.match, tps = meta.tps;
  document.title = `${m.p0} vs ${m.p1} · Replay`;
  $("n0").textContent = m.p0; $("n1").textContent = m.p1;
  $("n0").title = m.p0; $("n1").title = m.p1;
  for (const p of [0, 1]) $("e" + p).innerHTML = "<span><i></i></span>".repeat(10);
  const won = m.outcome === 1 ? 0 : m.outcome === 2 ? 1 : -1;
  if (won >= 0) $("pl" + won).classList.add("won");
  const tiebreak = won >= 0 && !m.forfeit && m.crowns[0] === m.crowns[1]; // level on crowns: decided by tower HP
  const tags = (m.forfeit ? `<span class="badge ff">Forfeit</span>` : "") + (m.upset ? `<span class="badge up">Upset</span>` : "") + (m.outcome === 3 ? `<span class="badge dr">Draw</span>` : "");
  $("result").innerHTML = (won >= 0 ? `<span><b>${esc(won ? m.p1 : m.p0)}</b> won ${m.crowns[won]}–${m.crowns[1 - won]}${tiebreak ? " on tower health" : ""}</span>` : `<span><b>Draw</b> ${m.crowns[0]}–${m.crowns[1]}</span>`)
    + `<span>·</span><span>${clock(meta.ticks, tps)} of play</span>` + (m.delta == null ? "" : `<span>·</span><span>±${Math.abs(m.delta).toFixed(1)} rating</span>`) + tags;
  if (!meta.faithful) { const w = $("warn"); w.hidden = false;
    w.textContent = "This replay was recorded on an older build of the simulator. What you see here is a re-run on the current build and may not match the original match."; }
  $("total").textContent = "/ " + clock(meta.ticks, tps);
  const scrub = $("scrub"); scrub.max = meta.ticks;
  $("marks").innerHTML = events.map((e) => `<i style="left:${(e[0] / meta.ticks) * 100}%;background:${P[e[1]]}"></i>`).join("")
    + (meta.ticks > meta.regulation ? `<i class="reg" style="left:${(meta.regulation / meta.ticks) * 100}%" title="Overtime starts"></i>` : "");
  $("speed").innerHTML = [1, 2, 4, 8].map((s) => `<button type="button" data-s="${s}" aria-pressed="${s === speed}">${s}×</button>`).join("");
  $("log-n").textContent = events.length ? `${events.length} cards played` : "";
  $("log").innerHTML = events.length ? events.map((e, i) => `<li data-i="${i}"><button type="button" data-t="${e[0]}">
      <span class="t">${clock(e[0], tps)}</span><i style="background:${P[e[1]]}"></i><span class="c">${esc(cardName(e[2]))}</span><span class="w">${e[2] === "ability" ? "" : e[3].toFixed(0) + ", " + e[4].toFixed(0)}</span></button></li>`).join("")
    : `<li class="none">Neither agent played a card.</li>`;
  if (m.deck0 || m.deck1) { const d = $("decks"); d.hidden = false;
    d.innerHTML = [[1, m.p1, m.deck1], [0, m.p0, m.deck0]].filter((x) => x[2]).map(([p, n, dk]) =>
      `<div><h3><i style="background:${P[p]}"></i>${esc(n)}</h3><div class="chips">${dk.map((c) => `<span class="chip">${esc(cardName(c))}</span>`).join("")}</div></div>`).join(""); }
  $("msg").hidden = true; $("stage").hidden = false;
  // ?t=<seconds> opens the replay paused at that moment, so a link can point at a play
  const at = parseFloat(new URLSearchParams(location.search).get("t"));
  resize(); seek(at > 0 ? at * tps : 0);
  setPlaying(!(at > 0) && !matchMedia("(prefers-reduced-motion: reduce)").matches);
  requestAnimationFrame(loop);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw); // tower letters use the web font
}

// ---------- sizing ----------
function resize() {
  const narrow = innerWidth <= 860;
  const maxH = Math.max(360, innerHeight - (narrow ? 120 : 96));
  const maxW = narrow ? document.querySelector(".wrap").clientWidth : Math.min(520, innerWidth * 0.42);
  tile = Math.max(8, Math.floor(Math.min(maxW / meta.w, maxH / meta.h)));
  W = tile * meta.w; H = tile * meta.h; dpr = Math.min(2.5, devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px";
  draw();
}
addEventListener("resize", () => { if (meta) resize(); });

// ---------- frame lookup + interpolation ----------
function frameAt(t) {
  let lo = 0, hi = frames.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (frames[mid][0] <= t) lo = mid; else hi = mid - 1; }
  return lo;
}
function scene(t) {
  const i = frameAt(t), a = frames[i], b = frames[Math.min(i + 1, frames.length - 1)];
  const k = b[0] > a[0] ? Math.min(1, (t - a[0]) / (b[0] - a[0])) : 0;
  const next = new Map(b[3].map((e) => [e[0], e]));
  const ents = a[3].map((e) => {
    const n = next.get(e[0]);
    return n ? { id: e[0], o: e[1], c: e[2], x: e[3] + (n[3] - e[3]) * k, y: e[4] + (n[4] - e[4]) * k, hp: e[5] + (n[5] - e[5]) * k, f: e[6], hw: e[7], hh: e[8] }
             : { id: e[0], o: e[1], c: e[2], x: e[3], y: e[4], hp: e[5], f: e[6], hw: e[7], hh: e[8] };
  });
  return { crowns: a[1], elixir: [a[2][0] + (b[2][0] - a[2][0]) * k, a[2][1] + (b[2][1] - a[2][1]) * k], ents };
}

// ---------- drawing ----------
const sx = (x) => x * tile, sy = (y) => (meta.h - y) * tile;
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function draw() {
  if (!meta) return;
  const s = scene(tick);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // field: each half faintly tinted with its seat colour
  ctx.fillStyle = "#0c1017"; ctx.fillRect(0, 0, W, H);
  let g = ctx.createLinearGradient(0, H, 0, H / 2); g.addColorStop(0, "rgba(90,168,255,.13)"); g.addColorStop(1, "rgba(90,168,255,.03)");
  ctx.fillStyle = g; ctx.fillRect(0, H / 2, W, H / 2);
  g = ctx.createLinearGradient(0, 0, 0, H / 2); g.addColorStop(0, "rgba(255,111,145,.13)"); g.addColorStop(1, "rgba(255,111,145,.03)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H / 2);
  ctx.strokeStyle = "rgba(255,255,255,.035)"; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 1; x < meta.w; x++) { ctx.moveTo(sx(x) + .5, 0); ctx.lineTo(sx(x) + .5, H); }
  for (let y = 1; y < meta.h; y++) { ctx.moveTo(0, sy(y) + .5); ctx.lineTo(W, sy(y) + .5); }
  ctx.stroke();
  // river + bridges
  const ry = sy(meta.river_y + meta.river_half), rh = meta.river_half * 2 * tile;
  ctx.fillStyle = "#0d2238"; ctx.fillRect(0, ry, W, rh);
  ctx.fillStyle = "rgba(90,168,255,.10)"; ctx.fillRect(0, ry, W, 1.5); ctx.fillRect(0, ry + rh - 1.5, W, 1.5);
  for (const bx of meta.bridges) {
    ctx.fillStyle = "#2a2f3c"; rr(sx(bx - meta.bridge_half), ry - 3, meta.bridge_half * 2 * tile, rh + 6, 4); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.stroke();
  }
  // deploy ripples (a ring where a card just landed)
  for (const e of events) {
    const age = tick - e[0];
    if (age < 0 || age > 16 || e[2] === "ability") continue;
    const k = age / 16;
    ctx.strokeStyle = P[e[1]]; ctx.globalAlpha = 1 - k; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx(e[3]), sy(e[4]), tile * (0.5 + 1.6 * k), 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
  // towers first, then ground units, then flyers on top
  const order = (e) => (e.f & 2 ? 0 : e.f & 1 ? 2 : 1);
  const ents = s.ents.slice().sort((a, b) => order(a) - order(b) || b.y - a.y);
  const fs = Math.max(7, Math.round(tile * 0.36));
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const e of ents) {
    const x = sx(e.x), y = sy(e.y), col = P[e.o], name = meta.cards[e.c] || "";
    if (e.f & 2) {
      const hw = (e.hw || 1.5) * tile, hh = (e.hh || 1.5) * tile, king = name === "king_tower";
      ctx.fillStyle = PD[e.o]; rr(x - hw, y - hh, hw * 2, hh * 2, tile * 0.3); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = col; ctx.font = `700 ${Math.round(tile * (king ? 0.95 : 0.7))}px "Barlow Condensed", sans-serif`;
      ctx.fillText(king ? "K" : "P", x, y + 1);
      hpBar(x, e.o === 0 ? y + hh + 6 : y - hh - 9, hw * 1.6, e.hp, col, 4);
      continue;
    }
    const r = tile * (e.f & 1 ? 0.4 : 0.44);
    ctx.globalAlpha = e.f & 4 ? 0.4 : 1;
    if (e.f & 1) { ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(x + r * .5, y + r * .9, r * .8, r * .4, 0, 0, 7); ctx.fill(); }
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.strokeStyle = e.f & 1 ? "#fff" : "rgba(5,7,11,.85)"; ctx.lineWidth = e.f & 1 ? 1.5 : 1.25; ctx.stroke();
    if (tile >= 13) { ctx.fillStyle = "#06080c"; ctx.font = `700 ${fs}px Inter, sans-serif`; ctx.fillText(abbr(name), x, y + .5); }
    if (e.hp < 0.995) hpBar(x, y - r - 5, tile * 0.9, e.hp, col, 3);
    ctx.globalAlpha = 1;
    if (hover && hover.id === e.id) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r + 3, 0, 7); ctx.stroke(); }
  }
  last = s;
}
function hpBar(x, y, w, hp, col, h) {
  ctx.fillStyle = "rgba(5,7,11,.8)"; rr(x - w / 2 - 1, y - 1, w + 2, h + 2, 2); ctx.fill();
  ctx.fillStyle = hp > 0.5 ? "#3ddc97" : hp > 0.25 ? "#ffb829" : "#ff6166";
  rr(x - w / 2, y, Math.max(1, w * Math.max(0, Math.min(1, hp))), h, 1.5); ctx.fill();
}

// ---------- side panel ----------
function hud() {
  const s = scene(tick), tps = meta.tps;
  for (const p of [0, 1]) {
    $("c" + p).textContent = s.crowns[p];
    $("pl" + p).classList.toggle("lead", s.crowns[p] > s.crowns[1 - p]);
    const el = s.elixir[p]; $("ev" + p).textContent = Math.floor(el);
    const cells = $("e" + p).children;
    for (let i = 0; i < 10; i++) cells[i].firstChild.style.setProperty("--f", Math.round(Math.max(0, Math.min(1, el - i)) * 100) + "%");
  }
  $("now").textContent = clock(tick, tps);
  $("ot").hidden = tick < meta.regulation;
  const scrub = $("scrub"); scrub.value = Math.round(tick); scrub.style.setProperty("--p", (tick / meta.ticks) * 100 + "%");
  // highlight the latest deploy at or before now; keep it in view while playing
  let i = -1; while (i + 1 < events.length && events[i + 1][0] <= tick) i++;
  if (i !== evIdx) {
    evIdx = i;
    const items = $("log").children;
    for (let k = 0; k < items.length; k++) { items[k].classList.toggle("past", k < i); items[k].classList.toggle("now", k === i); }
    if (i >= 0 && playing && items[i]) { const li = items[i], box = $("log"); box.scrollTop = li.offsetTop - box.clientHeight / 2 + li.clientHeight / 2; }
  }
}

// ---------- playback ----------
let prev = 0;
function loop(ts) {
  const dt = Math.min(0.1, (ts - prev) / 1000 || 0); prev = ts;
  if (playing) {
    tick = Math.min(meta.ticks, tick + dt * meta.tps * speed);
    if (tick >= meta.ticks) { setPlaying(false); finish(); }
    draw(); hud();
  }
  requestAnimationFrame(loop);
}
function finish() {
  const m = T.match, o = m.outcome;
  $("over-t").textContent = o === 3 ? "Draw" : (o === 1 ? m.p0 : m.p1) + " wins";
  $("over-s").textContent = `${m.crowns[0]}–${m.crowns[1]}` + (m.forfeit ? " · decided by forfeit" : o !== 3 && m.crowns[0] === m.crowns[1] ? " · decided on tower health" : "");
  $("over").hidden = false;
}
function setPlaying(on) {
  if (on && tick >= meta.ticks) tick = 0;
  playing = on; if (on) $("over").hidden = true;
  $("play").innerHTML = on ? ICON.pause : ICON.play; $("play").setAttribute("aria-label", on ? "Pause" : "Play");
}
function seek(t) { tick = Math.max(0, Math.min(meta.ticks, t)); $("over").hidden = true; evIdx = -2; draw(); hud(); }

$("play").addEventListener("click", () => setPlaying(!playing));
$("again").addEventListener("click", () => { seek(0); setPlaying(true); });
$("scrub").addEventListener("input", (e) => seek(+e.target.value));
$("speed").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; speed = +b.dataset.s;
  for (const x of $("speed").children) x.setAttribute("aria-pressed", String(x === b)); });
$("log").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) seek(+b.dataset.t); });
addEventListener("keydown", (e) => {
  if (!meta || e.target.matches("input, button") && e.key === " ") return;
  if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "ArrowRight") { e.preventDefault(); seek(tick + 5 * meta.tps); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); seek(tick - 5 * meta.tps); }
});

// ---------- hover: which unit is under the pointer ----------
cv.addEventListener("pointermove", (e) => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bd = 1e9;
  for (const u of (last && last.ents) || []) {
    const dx = sx(u.x) - mx, dy = sy(u.y) - my;
    const reach = u.f & 2 ? Math.max(u.hw, u.hh) * tile : tile * 0.6, d = Math.hypot(dx, dy);
    if (d < reach && d < bd) { bd = d; best = u; }
  }
  hover = best;
  const tip = $("tip");
  if (best) { tip.hidden = false; tip.style.left = sx(best.x) + "px"; tip.style.top = sy(best.y) + "px";
    tip.innerHTML = `<b style="color:${P[best.o]}">${esc(cardName(meta.cards[best.c] || "unit"))}</b><span>${Math.round(best.hp * 100)}% HP</span>`; }
  else tip.hidden = true;
  if (!playing) draw();
});
cv.addEventListener("pointerleave", () => { hover = null; $("tip").hidden = true; if (!playing) draw(); });

load();
</script>
</body>
</html>
