<title>Arena Replay</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* Layout: centered column — HUD bar, portrait arena canvas, twin elixir bars, transport. */
  :root{
    --bg:#eef1f6; --panel:#ffffff; --panel-2:#f5f7fb; --ink:#1a2130; --muted:#64718a;
    --line:#d9e0ec; --accent:#0f9d8f;
    --grass:#7fb86a; --grass-2:#73ad60; --grass-line:#6aa557; --enemy-tint:#86a9c4;
    --river:#5fa0d6; --river-2:#4b8cc6; --bridge:#b98b52; --bridge-2:#a2763f;
    --blue:#2f6bd6; --blue-dk:#1d4fa6; --red:#e0503f; --red-dk:#b23323;
    --gold:#f2b53c; --elixir:#d23c93; --elixir-bg:#e7d3e5;
    --shadow:0 2px 10px rgba(22,32,54,.10);
    --disp:'Rubik',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
    --sans:'Rubik',system-ui,-apple-system,Segoe UI,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0c111b; --panel:#141c2b; --panel-2:#101826; --ink:#e8eef8; --muted:#8e9cb4;
    --line:#263347; --accent:#2fd0c0;
    --grass:#37603a; --grass-2:#2f5733; --grass-line:#3c6b40; --enemy-tint:#2a4257;
    --river:#2a5d86; --river-2:#214e73; --bridge:#8a6338; --bridge-2:#6f4d29;
    --blue:#5a93f0; --blue-dk:#2f66c4; --red:#f0756a; --red-dk:#c04434;
    --gold:#f4c766; --elixir:#e867b8; --elixir-bg:#3a2340;
    --shadow:0 2px 12px rgba(0,0,0,.45); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0c111b; --panel:#141c2b; --panel-2:#101826; --ink:#e8eef8; --muted:#8e9cb4;
    --line:#263347; --accent:#2fd0c0;
    --grass:#37603a; --grass-2:#2f5733; --grass-line:#3c6b40; --enemy-tint:#2a4257;
    --river:#2a5d86; --river-2:#214e73; --bridge:#8a6338; --bridge-2:#6f4d29;
    --blue:#5a93f0; --blue-dk:#2f66c4; --red:#f0756a; --red-dk:#c04434;
    --gold:#f4c766; --elixir:#e867b8; --elixir-bg:#3a2340;
    --shadow:0 2px 12px rgba(0,0,0,.45); color-scheme:dark;
  }
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;align-items:center;gap:9px;overflow:hidden;
    padding:10px max(14px,env(safe-area-inset-left,0px));padding-block:12px;box-sizing:border-box;
  }
  .app{width:100%;max-width:430px;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
  .title{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  .title b{color:var(--accent)}

  .hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow)}
  .team{display:flex;align-items:center;gap:8px;font-weight:600}
  .team.r{justify-content:flex-end}
  .chip{width:12px;height:12px;border-radius:4px}
  .b{background:var(--blue)} .r0{background:var(--red)}
  .crowns{display:flex;gap:3px;align-items:center}
  .cr{width:15px;height:15px;opacity:.28}
  .cr.on{opacity:1}
  .clock{text-align:center;font-family:var(--mono)}
  .clock b{display:block;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
  .pill{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin-top:2px;display:inline-block}

  .stage{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
  canvas{border-radius:14px;box-shadow:var(--shadow);max-width:100%;max-height:100%;touch-action:none}
  .banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    gap:4px;font-family:var(--disp);font-weight:700;border-radius:14px;backdrop-filter:blur(2px);
    background:rgba(10,14,22,.28)}
  .banner .big{font-size:38px;letter-spacing:.03em;text-shadow:0 3px 14px rgba(0,0,0,.4)}
  .banner .sub{font-size:14px;color:#fff;opacity:.9;font-family:var(--mono)}

  .elxwrap{display:flex;flex-direction:column;gap:3px}
  .elxrow{display:flex;align-items:center;gap:7px}
  .elxrow .lab{font-size:10px;color:var(--muted);width:30px;font-weight:600;letter-spacing:.05em}
  .pips{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px;height:12px}
  .pip{background:var(--elixir-bg);border-radius:3px;transition:background .1s linear}
  .pip.on{background:var(--elixir)}
  .pips .val{display:none}
  .amt{font-family:var(--mono);font-size:12px;width:34px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

  .controls{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:8px 10px;box-shadow:var(--shadow)}
  button{font:inherit;font-weight:600;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);
    border-radius:9px;padding:0;width:38px;height:38px;cursor:pointer;display:grid;place-items:center;font-size:15px}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input[type=range]{flex:1;accent-color:var(--accent);min-width:0;height:4px}
  .spd{width:44px;font-family:var(--mono);font-size:13px}
  .foot{color:var(--muted);font-size:11px;text-align:center;font-family:var(--mono)}
  .load{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;flex:1;color:var(--muted);text-align:center;padding:20px}
  .load code{background:var(--panel-2);padding:2px 6px;border-radius:5px;font-family:var(--mono)}
  label.file{cursor:pointer;color:var(--accent);text-decoration:underline}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">

<div class="app">
  <div class="title">cr-sim · <b>Arena Replay</b></div>

  <div class="hud">
    <div class="team"><span class="chip b"></span><span>Blue</span>
      <span class="crowns" id="cr0"></span></div>
    <div class="clock"><b id="clock">0:00</b><span class="pill" id="phase">single</span></div>
    <div class="team r"><span class="crowns" id="cr1"></span><span>Red</span><span class="chip r0"></span></div>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="banner" id="banner"><div class="big" id="bigwin"></div><div class="sub" id="subwin"></div></div>
    <div class="load" id="load" hidden>
      <div>No replay loaded.</div>
      <div>Generate one: <code>python examples/record_trace.py 11 viewer/trace.json</code></div>
      <div>or <label class="file">open a trace.json<input type="file" id="file" accept=".json" hidden></label></div>
    </div>
  </div>

  <div class="elxwrap">
    <div class="elxrow"><span class="lab" style="color:var(--red)">RED</span>
      <div class="pips" id="pips1"></div><span class="amt" id="amt1">0</span></div>
    <div class="elxrow"><span class="lab" style="color:var(--blue)">BLUE</span>
      <div class="pips" id="pips0"></div><span class="amt" id="amt0">0</span></div>
  </div>

  <div class="controls">
    <button id="restart" title="Restart">↻</button>
    <button id="play" title="Play/Pause">▶</button>
    <input type="range" id="scrub" min="0" max="100" value="0" step="0.01">
    <button id="spd" class="spd" title="Speed">1×</button>
  </div>
  <div class="foot" id="foot">loading…</div>
</div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), el=id=>document.getElementById(id);
let meta=null, frames=[], playhead=0 /*in frames*/, playing=false, speed=1, last=0, dpr=1;
const SPEEDS=[0.5,1,2,4];

// build elixir pips + crown icons
for(const p of [0,1]){ const box=el('pips'+p); for(let i=0;i<10;i++){const d=document.createElement('div');d.className='pip';box.appendChild(d);} }
function crownSVG(){ return '<svg class="cr" viewBox="0 0 24 24" fill="'+'currentColor'+'"><path d="M3 7l4 4 5-7 5 7 4-4-2 12H5z"/></svg>'; }
for(const p of [0,1]){ let h=''; for(let i=0;i<3;i++) h+=crownSVG(); el('cr'+p).innerHTML=h; el('cr'+p).style.color='var('+(p?'--red':'--blue')+')'; }

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function glyph(name){
  const m={minipekka:'MP',babydragon:'BD',hogrider:'HR',musketeer:'MU',barbarians:'BB',
    skeletons:'SK',princess_tower:'',king_tower:''};
  if(name in m) return m[name];
  return name.slice(0,2).replace(/^./,c=>c.toUpperCase());
}

function fit(){
  const stage=cv.parentElement, availW=stage.clientWidth, availH=stage.clientHeight;
  const ar=meta?meta.w/meta.h:18/32; let w=availW,h=w/ar;
  if(h>availH){ h=availH; w=h*ar; }
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=w+'px'; cv.style.height=h+'px';
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  draw();
}
function W(){ return cv.width/dpr; } function H(){ return cv.height/dpr; }
function sx(x){ return (x/meta.w)*W(); }
function sy(y){ return H()-(y/meta.h)*H(); } // flip: player0 at bottom
function sl(u){ return (u/meta.w)*W(); }     // tile length -> px (x scale)

function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawArena(){
  const w=W(),h=H();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // grass, enemy half slightly cooler
  ctx.fillStyle=css('--grass'); ctx.fillRect(0,0,w,h);
  const g=ctx.createLinearGradient(0,0,0,h/2);
  g.addColorStop(0,css('--enemy-tint')); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=.20; ctx.fillStyle=g; ctx.fillRect(0,0,w,h/2); ctx.globalAlpha=1;
  // faint tile grid
  ctx.strokeStyle=css('--grass-line'); ctx.globalAlpha=.35; ctx.lineWidth=1;
  for(let i=1;i<18;i++){ctx.beginPath();ctx.moveTo(sx(i),0);ctx.lineTo(sx(i),h);ctx.stroke();}
  for(let i=1;i<32;i++){ctx.beginPath();ctx.moveTo(0,sy(i));ctx.lineTo(w,sy(i));ctx.stroke();}
  ctx.globalAlpha=1;
  // river (2 rows)
  const band=(meta.river_half||1)*2, yT=sy(meta.river_y+band/2);
  const rh=(band/meta.h)*h;
  const rg=ctx.createLinearGradient(0,yT,0,yT+rh);
  rg.addColorStop(0,css('--river')); rg.addColorStop(1,css('--river-2'));
  ctx.fillStyle=rg; ctx.fillRect(0,yT,w,rh);
  // bridges (aligned with the princess towers)
  for(const bx of meta.bridges){
    const bw=sl((meta.bridge_half||1.5)*2), x=sx(bx)-bw/2;
    const bg=ctx.createLinearGradient(x,0,x+bw,0);
    bg.addColorStop(0,css('--bridge-2'));bg.addColorStop(.5,css('--bridge'));bg.addColorStop(1,css('--bridge-2'));
    ctx.fillStyle=bg; ctx.fillRect(x,yT-1,bw,rh+2);
    ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;
    for(let k=0;k<4;k++){const px=x+bw*(k+.5)/4;ctx.beginPath();ctx.moveTo(px,yT);ctx.lineTo(px,yT+rh);ctx.stroke();}
  }
}

function lerp(a,b,t){return a+(b-a)*t;}

function drawToken(e, alpha){
  const [owner,cardIdx,x,y,hpf,flags]=e;
  const name=meta.cards[cardIdx]||'';
  const tower=flags&2, flying=flags&1, deploying=flags&4;
  const px=sx(x), py=sy(y);
  const fill=owner===0?css('--blue'):css('--red');
  const dk=owner===0?css('--blue-dk'):css('--red-dk');
  ctx.globalAlpha=alpha*(deploying?0.55:1);

  if(tower){
    const half=e[7]||(Math.abs(x-meta.w/2)<1?2:1.5);
    const king=half>=1.9;
    const s=sl(half*2), hw=s/2;
    // platform
    ctx.fillStyle=dk; roundRect(px-hw,py-hw,s,s,6); ctx.fill();
    ctx.fillStyle=fill; roundRect(px-hw+2,py-hw+2,s-4,s-7,5); ctx.fill();
    // merlons
    ctx.fillStyle=dk; const mn=king?4:3, mw=(s-4)/(mn*2-1);
    for(let k=0;k<mn;k++) ctx.fillRect(px-hw+2+k*2*mw, py-hw, mw, sl(0.4));
    // hp bar
    if(hpf<0.999){ const bw=s, bx=px-hw, by=py-hw-7;
      ctx.fillStyle='rgba(0,0,0,.35)';roundRect(bx,by,bw,5,2.5);ctx.fill();
      ctx.fillStyle=hpf>.5?'#54c86a':hpf>.25?css('--gold'):'#e2503f';
      roundRect(bx,by,bw*hpf,5,2.5);ctx.fill(); }
    ctx.globalAlpha=1; return;
  }

  // ground shadow (lifted for flyers)
  const r=Math.max(4, sl(0.46));
  const lift=flying?r*0.9:0;
  ctx.globalAlpha=alpha*0.22; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(px,py, r*0.9, r*0.5, 0,0,7); ctx.fill();
  ctx.globalAlpha=alpha*(deploying?0.55:1);

  // body
  ctx.beginPath(); ctx.arc(px,py-lift,r,0,7);
  ctx.fillStyle=fill; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=flying?css('--gold'):dk; ctx.stroke();
  // glyph
  ctx.fillStyle='rgba(255,255,255,.95)';
  ctx.font='600 '+Math.round(r*0.95)+'px '+css('--sans');
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(glyph(name), px, py-lift+0.5);
  // hp arc
  if(hpf<0.999){ ctx.beginPath(); ctx.arc(px,py-lift,r+2.5,-Math.PI/2,-Math.PI/2+hpf*2*Math.PI);
    ctx.lineWidth=2.2; ctx.strokeStyle=hpf>.5?'#54c86a':hpf>.25?css('--gold'):'#e2503f'; ctx.stroke(); }
  // deploy pulse
  if(deploying){ ctx.beginPath(); ctx.arc(px,py-lift,r+5,0,7); ctx.setLineDash([4,4]);
    ctx.strokeStyle=fill; ctx.lineWidth=1.5; ctx.stroke(); ctx.setLineDash([]); }
  ctx.globalAlpha=1;
}

function frameMap(f){ const m=new Map(); if(!f) return m; for(const e of f.ents) m.set(e[6], e); return m; }

function draw(){
  if(!meta) return;
  drawArena();
  const fa=frames[Math.floor(playhead)], fb=frames[Math.min(frames.length-1,Math.floor(playhead)+1)];
  const t=playhead-Math.floor(playhead);
  const ma=frameMap(fa), mb=frameMap(fb);
  const ids=new Set([...ma.keys(),...mb.keys()]);
  const list=[];
  for(const id of ids){
    const a=ma.get(id), b=mb.get(id);
    if(a&&b){ list.push([[b[0],b[1],lerp(a[2],b[2],t),lerp(a[3],b[3],t),lerp(a[4],b[4],t),b[5],b[6],b[7]],1]); }
    else if(a&&!b){ list.push([a, 1-t]); }       // died: fade out
    else { list.push([b, t]); }                   // spawned: fade in
  }
  // towers first, then units, sorted back-to-front
  list.sort((p,q)=>((p[0][5]&2)?0:1)-((q[0][5]&2)?0:1) || p[0][3]-q[0][3]);
  for(const [e,al] of list) drawToken(e,al);

  // HUD from nearest frame
  const cur=fb||fa;
  for(const p of [0,1]){ const c=cur.crowns[p];
    [...el('cr'+p).children].forEach((n,i)=>n.classList.toggle('on',i<c)); }
  for(const p of [0,1]){ const v=cur.elixir[p];
    [...el('pips'+p).children].forEach((n,i)=>n.classList.toggle('on',i<Math.floor(v)));
    el('amt'+p).textContent=v.toFixed(1); }
  const secs=Math.floor(cur.t/meta.tps);
  el('clock').textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  const reg=meta.tps*180;
  el('phase').textContent=cur.t>=reg?'overtime':(cur.t>=meta.tps*120?'double elixir':'single elixir');
  el('scrub').value=playhead;
}

function loop(now){
  if(!playing) return;
  const dt=(now-last)/1000; last=now;
  playhead+=dt*meta.fps*speed;
  if(playhead>=frames.length-1){ playhead=frames.length-1; showEnd(); playing=false; el('play').textContent='▶'; }
  draw();
  if(playing) requestAnimationFrame(loop);
}
function setPlay(p){ playing=p; el('play').textContent=p?'❚❚':'▶'; if(p){ if(playhead>=frames.length-1)playhead=0; last=performance.now(); requestAnimationFrame(loop);} }
function showEnd(){ const o=meta.outcome; el('bigwin').textContent=o===1?'BLUE WINS':o===2?'RED WINS':'DRAW';
  el('bigwin').style.color=o===1?css('--blue'):o===2?css('--red'):'#fff';
  el('subwin').textContent=meta.crowns[0]+' – '+meta.crowns[1]+' crowns';
  el('banner').style.display='flex'; }

function start(data){
  meta=data.meta; frames=data.frames; playhead=0;
  el('load').hidden=true; cv.style.display='block'; el('banner').style.display='none';
  el('scrub').max=frames.length-1;
  const o=meta.outcome;
  el('foot').textContent=`seed ${meta.seed} · ${(frames.length/meta.fps).toFixed(0)}s · lvl ${meta.level||11} · `+
    `result ${o===1?'Blue':o===2?'Red':'Draw'} ${meta.crowns[0]}–${meta.crowns[1]}`;
  fit(); setPlay(true);
}

el('play').onclick=()=>{ el('banner').style.display='none'; setPlay(!playing); };
el('restart').onclick=()=>{ playhead=0; el('banner').style.display='none'; draw(); };
el('scrub').oninput=e=>{ playhead=+e.target.value; playing=false; el('play').textContent='▶'; el('banner').style.display='none'; draw(); };
el('spd').onclick=()=>{ speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length]; el('spd').textContent=speed+'×'; };
el('file').onchange=e=>{ const f=e.target.files[0]; if(f) f.text().then(t=>start(JSON.parse(t))).catch(()=>el('foot').textContent='could not read file'); };
window.addEventListener('resize',()=>{ if(meta) fit(); });
window.matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>draw());

fetch('trace.json').then(r=>{if(!r.ok)throw 0;return r.json();}).then(start)
  .catch(()=>{ el('load').hidden=false; cv.style.display='none'; el('foot').textContent='no trace.json alongside page — open one below'; });
</script>
