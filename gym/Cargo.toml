[package]
name = "cr-sim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic fixed-point Clash-Royale-style battle simulator for RL."

[lib]
name = "cr_sim_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
# [A8] Upper bounds pin BELOW the supply-chain-compromised releases: serde_json
# >=1.0.147 was poisoned to depend on the `zmij` typosquat (replacing `ryu`), and
# serde_derive 1.0.229 (pulled by serde 1.0.229) on a fake `syn ^3` (replacing syn 2).
# 1.0.228 / 1.0.146 are the last clean releases using the legitimate ryu + syn 2.x.
serde = { version = ">=1.0.200, <1.0.229", features = ["derive"] }
serde_json = ">=1.0.100, <1.0.147"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
